name: 每日抓取榜单

# 每天 06:10（北京时间）自动抓一次，也可以手动触发
on:
  schedule:
    # GitHub 的 cron 按 UTC 算。UTC 22:10 = 北京时间次日 06:10
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 需要提交更新后的 data/zhihu.json
  actions: write    # 提交后要主动触发部署（GITHUB_TOKEN 的提交不会自己触发）

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配 ZHIHU_COOKIE
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          ROUNDS: '8'
        run: |
          # cookie 没配的话脚本会匿名请求，拿到 401/0 条，报错信息很难看懂。
          # 这里先拦一下，直接告诉人去哪配。
          if [ -z "$ZHIHU_COOKIE" ]; then
            echo "::error::没有配置 ZHIHU_COOKIE。Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          node scripts/fetch-zhihu.js

      - name: 检查结果
        # 抓取偶尔会因限流只拿到一两百条，覆盖现有 379 条反而是退步。
        # 低于阈值就判失败，不提交，站点保持上一次的好数据。
        run: |
          node -e "
          const j = require('./data/zhihu.json');
          const total = j.lists.reduce((s, L) => s + L.items.length, 0);
          const genres = j.lists.filter(L => L.type === 'genre').length;
          console.log('榜单', j.lists.length, '个 · 条目', total, '条 · 题材', genres, '个');
          if (total < 280) { console.error('条目只有 ' + total + ' 条，明显偏少（平时 379），放弃提交'); process.exit(1); }
          if (genres < 4)  { console.error('题材榜只有 ' + genres + ' 个，放弃提交'); process.exit(1); }
          "

      - name: 提交
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zhihu.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=0" >> $GITHUB_OUTPUT
          else
            git commit -m "自动更新榜单 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=1" >> $GITHUB_OUTPUT
          fi

      # 关键：用 GITHUB_TOKEN 做的提交不会触发其他工作流，必须显式触发部署，
      # 否则数据更新了但站点还是旧的。
      - name: 触发部署
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
